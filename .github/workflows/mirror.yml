# SPDX-License-Identifier: MPL-2.0
#
# After `mirror.yml` of the estate template (hyperpolymath/rsr-template-repo).
# The job checks out the full history and prints the commit. It does not push
# to another forge.
#
# The earlier form of this file called the reusable workflow `mirror-reusable.yml` of the
# standards repository. That call did not start: each run failed with no job.
name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Forge mirror readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify mirror ref integrity
        run: |
          set -euo pipefail
          echo "Verified commit $(git rev-parse HEAD) (${GITHUB_REF:-HEAD}) ready for downstream forge pull mirrors."
