# SPDX-License-Identifier: MPL-2.0
#
# Rust CI, after `rust-ci.yml` of the estate template
# (hyperpolymath/rsr-template-repo): compiles standalone scripts/*.rs utilities
# with -D warnings and runs cargo check and cargo test when a Cargo.toml is
# present. This repository has no Rust file today.
#
# The earlier form of this file called the reusable workflow `rust-ci-reusable.yml` of the
# standards repository. That call did not start: each run failed with no job.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-ci:
    name: Rust standalone tools and workspace gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile standalone Rust helpers and run tests
        run: |
          set -euo pipefail
          rustc --version
          mkdir -p "$RUNNER_TEMP/rust-bins"
          for src in scripts/*.rs; do
            [ -f "$src" ] || continue
            bin_name="$(basename "$src" .rs)"
            echo "Compiling $src (-D warnings)..."
            rustc --edition 2021 -D warnings "$src" -o "$RUNNER_TEMP/rust-bins/$bin_name"
          done
          if [ -f tests/workflows/archetype_lock_merge_test.sh ]; then
            bash tests/workflows/archetype_lock_merge_test.sh
          fi
          if [ -f Cargo.toml ]; then
            cargo check --all-targets --locked
            cargo test --locked
          fi
