# SPDX-License-Identifier: MPL-2.0
# Caller of the estate secret scanner in hyperpolymath/proven-cicd-and-workflows,
# at the commit that echidnabot and gitbot-fleet call. The called workflow runs
# gitleaks, a Rust-secrets check and a shell-secrets check.
#
# The earlier caller named the standards repository. It did not start: each
# run ended at creation, with no job and no check.
#
# Boundaries, as in the gitbot-fleet caller:
#   * The job id is `scan`. The called workflow reads this file and refuses a
#     caller that has a different job id or a pin that is not a full SHA.
#   * `fast-pr` is false: each run scans the full history.
#   * No `secrets:` line. The called workflow declares no workflow_call secret.
#   * `contents: read` is the whole grant.
# See .github/workflows/README.adoc.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/secret-scanner-reusable.yml@1fd5e6371a50f0fc3687206a5adca0cdf7b39aa6
    with:
      fast-pr: false
